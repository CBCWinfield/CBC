name: Daily site check
# Loads every page of cbcwinfield.org and checks the sermon videos play. A failed run emails
# the people watching this repository. Run it by hand from the Actions tab any time.
on:
  schedule:
    - cron: '17 12 * * *' # every day, 6:17 AM Central (7:17 in summer)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/site-check.js', '.github/workflows/site-check.yml']
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: run
        run: node scripts/site-check.js https://www.cbcwinfield.org 2>&1 | tee check.log; exit ${PIPESTATUS[0]}
      - name: Open an issue when something is broken
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('check.log') ? fs.readFileSync('check.log', 'utf8').slice(-6000) : '';
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'site-check' });
            const body = 'The daily check found a problem on cbcwinfield.org.\n\n```\n' + log + '\n```\n\nRun: ' + `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (open.data.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title: 'Site check: something on cbcwinfield.org is broken', labels: ['site-check'], body });
